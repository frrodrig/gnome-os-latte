name: GNOME OS Latte USB image

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/gnomeos-latte-usb.yml
      - build/**
      - elements/**
      - files/latte/**
      - files/kernel/**
      - README.md
      - docs/BUILD.md
  workflow_dispatch:
    inputs:
      staging_version:
        description: "Optional isolated staging version (latte.N); no production channel"
        type: string
        required: false
      staging_updates:
        description: "Build unsigned update candidates on the runner; do not upload them"
        type: boolean
        default: false
      test_installation:
        description: "Test installer daemon and installed UEFI boot on a new virtual disk"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gnomeos-latte-usb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on standard free Linux runner
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test early boot validation gates
        run: |
          python3 build/test-boot-validation.py
          python3 build/test-installer-transaction.py

      - name: Inspect and reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "CPU cores: $(nproc)"
          free -h
          df -h /

          # Remove only these preinstalled SDKs from this disposable runner.
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if [[ -d "$path" ]]; then
              sudo du -sh "$path"
              sudo rm -rf -- "$path"
            fi
          done
          sudo apt-get clean
          df -h /

      - name: Install BuildStream and sandbox tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap fuse3 lzip ostree pipx qemu-system-x86 mtools binutils cryptsetup-bin
          pipx install 'BuildStream==2.6.0'
          pipx inject buildstream \
            'buildstream-plugins==2.5.0' \
            'dulwich==0.24.0' \
            'requests==2.34.2' \
            'tomlkit==0.15.2'
          pipx_bin_dir="$(pipx environment --value PIPX_BIN_DIR)"
          echo "$pipx_bin_dir" >> "$GITHUB_PATH"
          bst_path="$(readlink -f "$pipx_bin_dir/bst")"
          bst_python="$(sed -n '1s/^#!\([^[:space:]]*\).*/\1/p' "$bst_path")"
          "$bst_python" -c '
          from importlib.metadata import version
          print("BuildStream plugin distribution:", version("buildstream-plugins"))
          '
          echo "BST_BIN=$pipx_bin_dir/bst" >> "$GITHUB_ENV"
          "$pipx_bin_dir/bst" --version
          # Ubuntu 24.04 restricts unprivileged user namespaces by default.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --ro-bind / / /bin/true

      - name: Check available build capacity
        shell: bash
        run: |
          set -euo pipefail
          free -h
          df -h /
          available_bytes="$(df --output=avail -B1 / | tail -n 1 | tr -d ' ')"
          available_gib=$((available_bytes / 1024 / 1024 / 1024))
          echo "Free root filesystem after setup: ${available_gib} GiB"
          if (( available_gib < 20 )); then
            echo "::error::Fewer than 20 GiB remain on the standard runner; refusing a predictably incomplete image build."
            exit 1
          fi
          if (( available_gib < 45 )); then
            echo "::warning::GNOME estimates about 50 GiB for a first build. Proceeding because GNOME's remote artifact cache may reduce local work; disk exhaustion remains possible."
          fi

      - name: Install firmware for disposable VM test
        if: inputs.test_installation
        run: sudo apt-get install --yes --no-install-recommends ovmf

      - name: Build and verify USB image
        id: build
        shell: bash
        env:
          LATTE_STAGING_VERSION: ${{ inputs.staging_version || '' }}
          STAGING_UPDATES: ${{ inputs.staging_updates || false }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gnomeos-latte-build.log"
          mkdir -p "$(dirname "$log")"
          set +e
          args=()
          if [[ "$STAGING_UPDATES" == true ]]; then
            args+=(--with-staging-updates)
          fi
          bash build/build-usb.sh "${args[@]}" 2>&1 | tee "$log"
          result=${PIPESTATUS[0]}
          set -e
          if (( result != 0 )); then
            echo "::error::BuildStream returned $result. Last useful log lines:"
            tail -n 160 "$log"
            exit "$result"
          fi
          test -s .build/out/disk.iso
          (cd .build/out && sha256sum disk.iso) | tee .build/out/SHA256SUMS
          du -h .build/out/disk.iso
          df -h /

      - name: Boot produced kernel and initrd with read-only USB ISO
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 build/smoke-test-image.py .build/out/disk.iso \
            --output .build/boot-smoke 2>&1 | tee "$RUNNER_TEMP/gnomeos-latte-smoke.log"

      - name: Verify isolated update-set consistency
        if: inputs.staging_updates
        run: |
          python3 build/verify-staging-updates.py .build/staging-updates \
            | tee "$RUNNER_TEMP/latte-staging-updates.log"

      - name: Install and boot disposable UEFI disk without USB ISO
        if: inputs.test_installation
        run: |
          python3 build/test-install-vm.py .build/out/disk.iso \
            --output .build/install-test \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd

      - name: Upload ISO and checksum (one-day retention)
        if: success() && !inputs.staging_updates && !inputs.test_installation && !inputs.staging_version && steps.build.outcome == 'success' && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gnomeos-latte-usb-${{ github.run_id }}
          path: |
            .build/out/disk.iso
            .build/out/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Preserve early boot evidence (one-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnomeos-latte-boot-evidence-${{ github.run_id }}
          path: |
            .build/boot-smoke/partition-table.json
            .build/boot-smoke/kernel.config
            .build/boot-smoke/qemu-boot.log
            .build/boot-smoke/boot-smoke.json
            .build/boot-smoke/verity-verify.log
            .build/boot-smoke/verity-verify.json
            .build/install-test/install.log
            .build/install-test/installed.log
            .build/install-test/result.json
            ${{ runner.temp }}/gnomeos-latte-smoke.log
            ${{ runner.temp }}/latte-staging-updates.log
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Preserve build log (one-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnomeos-latte-build-log-${{ github.run_id }}
          path: ${{ runner.temp }}/gnomeos-latte-build.log
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
